commonsCompress = "1.27.1"
xz = "1.9"
zip4j = "2.11.5"
zstdJni = "1.5.6-5"
coil = "2.7.0"
splashscreen = "1.0.1"
biometric = "1.1.0"
junit = "4.13.2"
